[versions]
activity = "1.13.0"
android-gradle-plugin = "9.3.1"
compose-bom = "2026.06.01"
# Explicit override: this alpha is newer than the Material 3 version selected by the BOM.
compose-material3 = "1.5.0-alpha25"
spotless = "8.9.0"
kotlin = "2.4.10"
ktx = "1.19.0"
json = "20240303"
sqlite = "2.6.2"
# Explicit override: keep tooling aligned with the project's selected Compose compiler line.
ui-tooling = "1.11.4"
viewmodel-lifecycle = "2.11.0"

[libraries]
androidx-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "ktx" }
runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "viewmodel-lifecycle" }
activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }

compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "android-gradle-plugin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }