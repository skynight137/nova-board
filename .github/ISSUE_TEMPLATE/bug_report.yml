name: 🐞 Bug report
description: Report a bug or an issue.
title: 'bug: '
labels: ['Bug report']
body:
  - type: markdown
    attributes:
      value: |
        # Auto Click bug report

        Before creating a new bug report, please keep the following in mind:

        - **Do not submit a duplicate bug report**: Search existing issues before opening a new report.
  - type: textarea
    attributes:
      label: Bug description
      description: |
        - Describe the bug in detail
        - Add steps to reproduce
        - Include images and videos if possible
    validations:
      required: true
  - type: textarea
    attributes:
      label: App version and environment
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: Attach relevant logs or screenshots when available.
      render: shell
    validations:
      required: true
  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your bug report will be closed if you don't follow the checklist below.
      options:
        - label: I have checked all open and closed bug reports and this is not a duplicate.
          required: true
        - label: I have chosen an appropriate title.
          required: true
        - label: All requested information has been provided properly.
          required: true
        - label: The bug is reproducible in this project
          required: true